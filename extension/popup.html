<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JobTrail Capture</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101827; color: #e5eefc; }
      body { width: 360px; margin: 0; }
      main { padding: 16px; }
      h1 { margin: 0; font-size: 18px; }
      p { color: #a7b6cc; font-size: 12px; }
      label { display: grid; gap: 5px; margin-top: 10px; font-size: 12px; color: #a7b6cc; }
      input, select, textarea { box-sizing: border-box; width: 100%; border: 1px solid #3a4b64; border-radius: 8px; background: #19253a; color: #e5eefc; padding: 8px; font: inherit; }
      textarea { min-height: 74px; resize: vertical; }
      button { margin-top: 12px; border: 0; border-radius: 8px; padding: 9px 12px; background: #72a7ff; color: #071225; font-weight: 700; cursor: pointer; }
      button.secondary { background: #263650; color: #e5eefc; }
      button:disabled { opacity: .55; cursor: wait; }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      .hidden { display: none; }
      #message { min-height: 18px; }
      .error { color: #ff9aab; }
      .success { color: #7ee2bd; }
    </style>
  </head>
  <body>
    <main>
      <h1>JobTrail Capture</h1>
      <p id="message">Sign in to save the current job.</p>
      <section id="auth">
        <label>Email<input id="email" type="email" autocomplete="email" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
        <div class="row"><button id="sign-in" type="button">Sign in</button><button id="sign-up" class="secondary" type="button">Sign up</button></div>
      </section>
      <section id="capture" class="hidden">
        <button id="read-page" class="secondary" type="button">Read current page</button>
        <form id="job-form">
          <label>Role<input id="title" required maxlength="120"></label>
          <label>Company<input id="company" required maxlength="120"></label>
          <label>Location<input id="location" maxlength="120"></label>
          <label>Resume used<select id="resume"><option value="">None selected</option></select></label>
          <label>Description<textarea id="description" maxlength="50000"></textarea></label>
          <label><input id="needs-review" type="checkbox" checked> Needs review</label>
          <div class="row"><button id="save" type="submit">Save as applied</button><button id="retry" class="secondary" type="button">Retry queued</button></div>
        </form>
        <button id="sign-out" class="secondary" type="button">Sign out</button>
      </section>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
